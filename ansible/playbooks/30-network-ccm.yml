---
- name: Bootstrap dev cluster networking and cloud integration
  hosts: role_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Ensure Calico manifest directory exists
      ansible.builtin.file:
        path: /etc/kubernetes/addons/calico
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download pinned Calico manifests
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/{{ item }}"
        dest: "/etc/kubernetes/addons/calico/{{ item }}"
        checksum: "{{ calico_manifest_checksums[item] }}"
        owner: root
        group: root
        mode: '0644'
        timeout: 60
      loop:
        - v3_projectcalico_org.yaml
        - tigera-operator.yaml

    - name: Create missing Calico API resources
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - /usr/bin/kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - create
          - --save-config=false
          - --field-manager=blogapp-ansible
          - -f
          - /etc/kubernetes/addons/calico/v3_projectcalico_org.yaml
      register: calico_api_create
      changed_when: calico_api_create.stdout is search('(?m) created$')
      failed_when: >-
        calico_api_create.rc != 0 and
        (
          calico_api_create.rc != 1 or
          (calico_api_create.stderr_lines | length == 0) or
          (
            calico_api_create.stderr_lines
            | reject('match', '^Error from server [(]AlreadyExists[)]:')
            | list
            | length > 0
          )
        )

    - name: Deploy Tigera Operator
      when: not ansible_check_mode
      block:
        - name: Apply Tigera Operator manifest
          ansible.builtin.command:
            argv:
              - /usr/bin/kubectl
              - --kubeconfig=/etc/kubernetes/admin.conf
              - apply
              - -f
              - /etc/kubernetes/addons/calico/tigera-operator.yaml
          register: tigera_operator_apply
          changed_when: >-
            tigera_operator_apply.stdout
            is search('(?m) (created|configured)$')

        - name: Wait for Tigera Operator deployment
          ansible.builtin.command:
            argv:
              - /usr/bin/kubectl
              - --kubeconfig=/etc/kubernetes/admin.conf
              - rollout
              - status
              - deployment/tigera-operator
              - --namespace=tigera-operator
              - --timeout=180s
          changed_when: false

    - name: Configure Calico networking
      when: not ansible_check_mode
      block:
        - name: Wait for Installation CRD to become established
          ansible.builtin.command:
            argv:
              - /usr/bin/kubectl
              - --kubeconfig=/etc/kubernetes/admin.conf
              - wait
              - --for=condition=Established
              - --timeout=30s
              - crd/installations.operator.tigera.io
          register: calico_installation_crd
          changed_when: false
          until: calico_installation_crd.rc == 0
          retries: 6
          delay: 5

        - name: Render Calico installation manifest
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/calico-installation.yml.j2"
            dest: /etc/kubernetes/addons/calico/installation.yaml
            owner: root
            group: root
            mode: '0644'

        - name: Apply Calico installation manifest
          ansible.builtin.command:
            argv:
              - /usr/bin/kubectl
              - --kubeconfig=/etc/kubernetes/admin.conf
              - apply
              - -f
              - /etc/kubernetes/addons/calico/installation.yaml
          register: calico_installation_apply
          changed_when: >-
            calico_installation_apply.stdout
            is search('(?m) (created|configured)$')

    - name: Inspect Calico bootstrap status
      when: not ansible_check_mode
      block:
        - name: Read Calico and node status
          ansible.builtin.command:
            cmd: >-
              /usr/bin/kubectl
              --kubeconfig=/etc/kubernetes/admin.conf
              get {{ item }}
          loop:
            - "pods --namespace=calico-system -o wide"
            - "daemonsets --namespace=calico-system -o wide"
            - "tigerastatus"
            - "nodes -o wide"
          register: calico_bootstrap_status
          changed_when: false

        - name: Display Calico and node status
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines }}"
          loop: "{{ calico_bootstrap_status.results }}"
          loop_control:
            label: "{{ item.item }}"

    - name: Deploy AWS cloud controller manager
      when: not ansible_check_mode
      block:
        - name: Ensure AWS CCM manifest directory exists
          ansible.builtin.file:
            path: /etc/kubernetes/addons/aws-ccm
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Copy AWS CCM RBAC manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../files/aws-ccm-rbac.yml"
            dest: /etc/kubernetes/addons/aws-ccm/rbac.yaml
            owner: root
            group: root
            mode: '0644'

        - name: Render AWS CCM workload manifest
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/aws-ccm-daemonset.yml.j2"
            dest: /etc/kubernetes/addons/aws-ccm/workload.yaml
            owner: root
            group: root
            mode: '0644'

        - name: Apply AWS CCM manifests
          ansible.builtin.command:
            argv:
              - /usr/bin/kubectl
              - --kubeconfig=/etc/kubernetes/admin.conf
              - apply
              - -f
              - "/etc/kubernetes/addons/aws-ccm/{{ item }}"
          loop:
            - rbac.yaml
            - workload.yaml
          register: aws_ccm_apply
          changed_when: >-
            aws_ccm_apply.stdout
            is search('(?m) (created|configured)$')

        - name: Wait for AWS CCM DaemonSet rollout
          ansible.builtin.command:
            argv:
              - /usr/bin/kubectl
              - --kubeconfig=/etc/kubernetes/admin.conf
              - rollout
              - status
              - daemonset/aws-cloud-controller-manager
              - --namespace=kube-system
              - --timeout=180s
          changed_when: false