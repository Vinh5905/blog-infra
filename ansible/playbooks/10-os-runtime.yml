---
- name: Prepare dev Kubernetes nodes
  hosts: "role_control_plane,role_worker"
  become: true
  gather_facts: true

  tasks:
    - name: Verify Ubuntu version and CPU architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "Expected Ubuntu 24.04 on x86_64."
        success_msg: "Node matches the expected OS and architecture."

    - name: Verify internal Kubernetes API DNS resolves
      ansible.builtin.command:
        cmd: "getent ahostsv4 {{ kubernetes_api_dns }}"
      changed_when: false
      check_mode: false

    - name: Verify system clock is synchronized
      ansible.builtin.command:
        cmd: timedatectl show --property=NTPSynchronized --value
      register: clock_sync
      changed_when: false
      check_mode: false
      failed_when: clock_sync.rc != 0 or clock_sync.stdout | trim != 'yes'

    - name: Refresh Ubuntu package lists
      ansible.builtin.apt:
        update_cache: true

    - name: Detect active swap
      ansible.builtin.command:
        cmd: swapon --show --noheadings
      register: active_swap
      changed_when: false
      check_mode: false

    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff --all
      when: (active_swap.stdout | trim) != ''

    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*[ \t]+\S+[ \t]+swap[ \t]+[^\r\n]*)$'
        replace: '# \1'
        backup: true

    - name: Configure kernel modules to load at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/blogapp-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load Kubernetes kernel modules now
      ansible.builtin.command:
        cmd: "modprobe {{ item }}"
        creates: "/sys/module/{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Persist Kubernetes kernel network settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-blogapp-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply Kubernetes kernel network settings when needed
      when: not ansible_check_mode
      block:
        - name: Read current kernel network settings
          ansible.builtin.command:
            cmd: >-
              sysctl -n net.ipv4.ip_forward
              net.bridge.bridge-nf-call-iptables
              net.bridge.bridge-nf-call-ip6tables
          register: kubernetes_sysctl
          changed_when: false

        - name: Load Kubernetes sysctl configuration
          ansible.builtin.command:
            cmd: sysctl -p /etc/sysctl.d/99-blogapp-kubernetes.conf
          when: kubernetes_sysctl.stdout_lines != ['1', '1', '1']

    - name: Verify runtime package versions are configured
      ansible.builtin.assert:
        that:
          - containerd_version | length > 0
          - runc_version | length > 0
        fail_msg: "Set containerd_version and runc_version before installing."

    - name: Install pinned container runtime packages
      ansible.builtin.apt:
        name:
          - "containerd={{ containerd_version }}"
          - "runc={{ runc_version }}"
        state: present
        lock_timeout: 120
      notify: Restart containerd

    - name: Ensure containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure containerd for Kubernetes
      ansible.builtin.template:
        src: ../templates/containerd-config.toml.j2
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    - name: Apply pending containerd restart before health checks
      ansible.builtin.meta: flush_handlers

    - name: Check containerd plugins after configuration
      when: not ansible_check_mode
      block:
        - name: Read containerd plugin status
          ansible.builtin.command:
            cmd: ctr plugins ls
          register: containerd_plugins
          changed_when: false

        - name: Display containerd plugin status
          ansible.builtin.debug:
            var: containerd_plugins.stdout_lines

    - name: Download pinned crictl archive
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
        dest: "/var/cache/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ crictl_sha256 }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install crictl binary
      ansible.builtin.unarchive:
        src: "/var/cache/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Configure crictl endpoints
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        owner: root
        group: root
        mode: '0644'
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
          image-endpoint: unix:///run/containerd/containerd.sock
          timeout: 10
          debug: false

    - name: Check containerd through CRI
      when: not ansible_check_mode
      block:
        - name: Read CRI runtime information
          ansible.builtin.command:
            cmd: /usr/local/bin/crictl --config /etc/crictl.yaml info --output json
          register: cri_info
          changed_when: false

        - name: Verify CRI runtime is ready
          ansible.builtin.assert:
            that:
              - >-
                ((cri_info.stdout | from_json)['status']['conditions']
                | selectattr('type', 'equalto', 'RuntimeReady')
                | map(attribute='status')
                | list) == [true]
            fail_msg: "Containerd CRI does not report RuntimeReady=true."
            success_msg: "Containerd CRI reports RuntimeReady=true."

        - name: Display CRI runtime conditions
          ansible.builtin.debug:
            msg: "{{ (cri_info.stdout | from_json)['status']['conditions'] }}"

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure Kubernetes APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        owner: root
        group: root
        mode: '0644'
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /

    - name: Refresh package lists including Kubernetes repository
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 120

    - name: Inspect available Kubernetes package versions
      when: not ansible_check_mode
      block:
        - name: Read Kubernetes package candidates
          ansible.builtin.command:
            cmd: apt-cache policy kubeadm kubelet kubectl
          register: kubernetes_package_candidates
          changed_when: false

        - name: Display Kubernetes package candidates
          ansible.builtin.debug:
            var: kubernetes_package_candidates.stdout_lines

    - name: Install pinned Kubernetes packages
      ansible.builtin.apt:
        name:
          - "kubeadm={{ kubernetes_package_version }}"
          - "kubelet={{ kubernetes_package_version }}"
          - "kubectl={{ kubernetes_package_version }}"
        state: present
        lock_timeout: 120

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Enable kubelet at boot
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true

    - name: Verify installed Kubernetes package versions
      when: not ansible_check_mode
      block:
        - name: Gather installed package information
          ansible.builtin.package_facts:
            manager: apt

        - name: Verify each Kubernetes package matches the pinned version
          ansible.builtin.assert:
            that:
              - item in ansible_facts['packages']
              - ansible_facts['packages'][item][0]['version'] == kubernetes_package_version
            fail_msg: "{{ item }} must be installed at version {{ kubernetes_package_version }}."
            success_msg: "{{ item }} matches version {{ kubernetes_package_version }}."
          loop:
            - kubeadm
            - kubelet
            - kubectl

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted