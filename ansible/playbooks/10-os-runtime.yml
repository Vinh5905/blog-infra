---
- name: Prepare dev Kubernetes control plane
  hosts: role_control_plane
  become: true
  gather_facts: true

  tasks:
    - name: Verify Ubuntu version and CPU architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "Expected Ubuntu 24.04 on x86_64."
        success_msg: "Control plane matches the expected OS and architecture."

    - name: Verify internal Kubernetes API DNS resolves
      ansible.builtin.command:
        cmd: getent ahostsv4 api.dev.blogapp.todicode.tech
      changed_when: false
      check_mode: false

    - name: Verify system clock is synchronized
      ansible.builtin.command:
        cmd: timedatectl show --property=NTPSynchronized --value
      register: clock_sync
      changed_when: false
      check_mode: false
      failed_when: clock_sync.rc != 0 or clock_sync.stdout | trim != 'yes'

    - name: Refresh Ubuntu package lists
      ansible.builtin.apt:
        update_cache: true

    - name: Detect active swap
      ansible.builtin.command:
        cmd: swapon --show --noheadings
      register: active_swap
      changed_when: false
      check_mode: false

    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff --all
      when: (active_swap.stdout | trim) != ''

    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*[ \t]+\S+[ \t]+swap[ \t]+[^\r\n]*)$'
        replace: '# \1'
        backup: true

    - name: Configure kernel modules to load at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/blogapp-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load Kubernetes kernel modules now
      ansible.builtin.command:
        cmd: "modprobe {{ item }}"
        creates: "/sys/module/{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Persist Kubernetes kernel network settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-blogapp-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply Kubernetes kernel network settings when needed
      when: not ansible_check_mode
      block:
        - name: Read current kernel network settings
          ansible.builtin.command:
            cmd: >-
              sysctl -n net.ipv4.ip_forward
              net.bridge.bridge-nf-call-iptables
              net.bridge.bridge-nf-call-ip6tables
          register: kubernetes_sysctl
          changed_when: false

        - name: Load Kubernetes sysctl configuration
          ansible.builtin.command:
            cmd: sysctl -p /etc/sysctl.d/99-blogapp-kubernetes.conf
          when: kubernetes_sysctl.stdout_lines != ['1', '1', '1']

    - name: Verify runtime package versions are configured
      ansible.builtin.assert:
        that:
          - containerd_version | length > 0
          - runc_version | length > 0
        fail_msg: "Set containerd_version and runc_version before installing."

    - name: Install pinned container runtime packages
      ansible.builtin.apt:
        name:
          - "containerd={{ containerd_version }}"
          - "runc={{ runc_version }}"
        state: present
        lock_timeout: 120
      notify: Restart containerd

    - name: Ensure containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure containerd for Kubernetes
      ansible.builtin.template:
        src: ../templates/containerd-config.toml.j2
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    - name: Apply pending containerd restart before health checks
      ansible.builtin.meta: flush_handlers

    - name: Check containerd plugins after configuration
      when: not ansible_check_mode
      block:
        - name: Read containerd plugin status
          ansible.builtin.command:
            cmd: ctr plugins ls
          register: containerd_plugins
          changed_when: false

        - name: Display containerd plugin status
          ansible.builtin.debug:
            var: containerd_plugins.stdout_lines

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted