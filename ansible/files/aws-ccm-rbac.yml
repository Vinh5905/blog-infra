---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-cloud-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blogapp-aws-ccm-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blogapp-aws-ccm-nodes
subjects:
  - kind: ServiceAccount
    name: aws-cloud-controller-manager
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blogapp-aws-ccm-nodes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blogapp-aws-ccm-leader-election
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]

  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cloud-controller-manager"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blogapp-aws-ccm-leader-election
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: aws-cloud-controller-manager
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blogapp-aws-ccm-leader-election