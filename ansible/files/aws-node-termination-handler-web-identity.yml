apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-node-termination-handler
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: aws-node-termination-handler
          volumeMounts:
            - name: aws-web-identity-token
              mountPath: /var/run/secrets/aws
              readOnly: true
      volumes:
        - name: aws-web-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token